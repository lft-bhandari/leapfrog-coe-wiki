[project]
name = "coe-wiki-ingest"
version = "0.1.0"
description = "CoE Wiki ingest CLI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "markdownify>=0.11.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ingest = "ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
